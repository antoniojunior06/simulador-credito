<div class="header">
  <h1>
    <img
      class="logo"
      src="/assets/img/logo.png"
      alt="Logo"
      routerLink="/listaAtividades"
    />
  </h1>
  <span class="divisor"></span>
  <h2 class="titulo">Simulador de empréstimo</h2>

  @if (authService.isLogado()) {

      <span class="username">{{ authService.usuario?.role }}</span>
      <mat-icon fontIcon="logout" (click)="logout()" class="logout-icon"></mat-icon>
    </div>
  }

</div>
